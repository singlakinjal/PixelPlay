<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - PixelPlay</title>

    <link rel="stylesheet" href="../css/Signup.css">
    <link rel="stylesheet" href="../css/common.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">
                🎮 PixelPlay
            </a>
            <nav class="main-nav">
                <a href="games.html" class="nav-link">Games</a>
                <a href="friends.html" class="nav-link"> Friends</a>
                <a href="login.html" class="nav-link">Login</a>
                <a href="about.html" class="nav-link">About</a>
            </nav>
        </div>
    </header>


    <main class="container">

        <div class="outerdiv">
            <div class="innerdiv">
                <p class="elements" id="alreadyauser">Already a user?<a href="login.html">Sign in</a></p>
                <input id="email" type="email" class="elements" placeholder="Email" required>
                <input id="username" type="text" class="elements" placeholder="Username" required>
                <input id="password" type="password" class="elements" placeholder="Password" required>
                <input id="confirm-password" type="password" class="elements" placeholder="Confirm Password" required>
                <p id="signup-message" class="elements" style="color: cyan;"></p>
                <button id="btn" class="elements">Sign Up</button>
            </div>
        </div>
    </main>
    

        <div class="container">
            <div class="bottom">
                <div class="follow">
                    <h4>Follow Us</h4>
                    <div class="socials">
                        <a href="#"><img src="../assets/instagram.png"></a>
                        <a href="#"><img src="../assets/facebook.png"></a>
                        <a href="#"><img src="../assets/X.png"></a>
                    </div>
                </div>

                <div class="support">
                    <h4>Support</h4>
                    <ul>
                        <li><a href="#">Help Center</a></li>
                        <li><a href="#">Terms of Service</a></li>
                        <li><a href="#">Privacy Policy</a></li>
                    </ul>
                </div>
            </div>

            <div class="lastline">
                <p>&copy; 2025 PixelPlay. A Capstone Project for SNW.</p>
            </div>
        </div>
    </footer>
    <script src="../javascript/signup.js"></script>

</body>

</html>
